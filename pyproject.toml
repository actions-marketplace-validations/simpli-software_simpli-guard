[project]
name = "simpli-guard"
version = "0.1.0"
description = "Security scanning (code, dependencies, secrets, IaC, containers, live surface) with noise reduction, run as a GitHub Action."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Simpli Software" }]
dependencies = [
    "anthropic>=1.13",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.14"]

[project.urls]
Homepage = "https://github.com/simpli-software/simpli-guard"
Issues = "https://github.com/simpli-software/simpli-guard/issues"
Source = "https://github.com/simpli-software/simpli-guard"

[project.scripts]
simpli-guard = "simpli_guard.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
simpli_guard = ["py.typed"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
